apiVersion: v1
kind: Service
metadata:
  name: nginx-np
  lables:
    purpose: Nodeport-demo
spec:
  type: NodePort
  selector:
    project: roboshop
    environment: dev
    purpose: demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-np
  lables:
    project: roboshop
    environment: dev
    purpose: demo
spec:
  containers:
  - name: nginx
    image: nginx
