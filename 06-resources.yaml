apiVersion: v1
kind: Pod
metadata: 
  name: resources
  labels:
    project: roboshop
    environment: dev
spec: 
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:  #soft limit
        cpu: "100m"
        memory: "68Mi"
      limits:  #hard limit
        cpu: "200m"
        memory: "128Mi"