apiVersion: v1
kind: Service
metadata:
  name: sc-headless-svc
  labels:
    purpose: headless-demo
    project: roboshop
spec:
  clusterIP: None
  selector:
    purpose: headless-demo
    project: roboshop
---
apiVersion: v1
kind: Service
metadata:
  name: sc-normal-svc
  labels:
    purpose: headless-demo
    project: roboshop
spec:
  ports:
  - port: 80
  selector:
    purpose: headless-demo
    project: roboshop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-demo
spec:
  selector:
    matchLabels:
      purpose: headless-demo
      project: roboshop     # has to match .spec.template.metadata.labels
  serviceName: "sc-headless-demo"
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        purpose: headless-demo
        project: roboshop # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-dynamic"
      resources:
        requests:
          storage: 2Gi