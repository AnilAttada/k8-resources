apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
  labels:
    purpose: service-loadbalancer-demo
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    environment: dev
    purpose: demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-lb
  labels:
    project: roboshop
    environment: dev
    purpose: demo
spec:
  containers:
  - name: nginx
    image: nginx  